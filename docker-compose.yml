services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: awh
      POSTGRES_PASSWORD: awh
      POSTGRES_DB: awh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awh -d awh"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
